[package]
name = "agentalign"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Agent Configuration Unification Engine. Syncs MCP servers, agent definitions, instruction files, and skills across Claude, Cursor, Gemini, Codex, OpenCode, and Antigravity via ~/.agents/ canonical store."
repository = "https://github.com/Jonathangadeaharder/agentalign"
homepage = "https://github.com/Jonathangadeaharder/agentalign"
readme = "README.md"
keywords = ["mcp", "config", "cli", "agent", "sync"]
categories = ["command-line-utilities", "config", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"
thiserror = "2"
anyhow = "1"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }
keyring = "3"
walkdir = "2"
hex = "0.4"
notify = "7"
chrono = "0.4"
ctrlc = "3"
fs2 = "0.4"
libc = "0.2"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
