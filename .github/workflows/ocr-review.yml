# OpenCodeReview (OCR) — CodeRabbit fallback, manual trigger only.
#
# Replaces PR-Agent (retired). Runs on the local self-hosted Mac runner since
# OCR is pre-configured on that machine against a local LLM proxy
# (meta-router at localhost:4000) — not reachable from GitHub-hosted runners.
#
# Trigger: comment `/open-code-review` (or `@open-code-review`) on a PR.
# Gate: repo variable ENABLE_OCR must be "true" (off by default).

name: OpenCodeReview PR Review

concurrency:
  group: ocr-${{ github.event.issue.number }}
  cancel-in-progress: true

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    runs-on: self-hosted
    if: |
      vars.ENABLE_OCR == 'true' &&
      github.event.issue.pull_request != null &&
      (startsWith(github.event.comment.body, '/open-code-review') ||
       startsWith(github.event.comment.body, '@open-code-review'))
    steps:
      - name: Get PR context
        id: pr-context
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_sha', pr.head.sha);

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.pr-context.outputs.head_sha }}

      - name: Fetch PR head ref (ensures fork commits are available)
        run: git fetch origin pull/${{ github.event.issue.number }}/head

      - name: Run OpenCodeReview
        id: review
        run: |
          # ocr is pre-installed + pre-configured on this runner
          # (~/.opencodereview/config.json — local meta-router provider).
          ocr review \
            --from "origin/${{ steps.pr-context.outputs.base_ref }}" \
            --to "${{ steps.pr-context.outputs.head_sha }}" \
            --format json \
            > /tmp/ocr-result.json 2>/tmp/ocr-stderr.log || true

          echo "OCR review completed. Output:"
          cat /tmp/ocr-result.json
          echo "OCR review completed. Error log:"
          cat /tmp/ocr-stderr.log

      - name: Post review comments to PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = '/tmp/ocr-result.json';

            let result;
            try {
              result = JSON.parse(fs.readFileSync(path, 'utf8'));
            } catch (e) {
              const stderr = fs.readFileSync('/tmp/ocr-stderr.log', 'utf8').trim();
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `⚠️ **OpenCodeReview** encountered an error:\n\`\`\`\n${stderr}\n\`\`\``,
              });
              return;
            }

            const comments = result.comments || [];
            const warnings = result.warnings || [];

            if (comments.length === 0) {
              const message = result.message || 'No comments generated. Looks good to me.';
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `✅ **OpenCodeReview**: ${message}`,
              });
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const commitSha = pr.head.sha;

            const reviewComments = [];
            const commentsWithoutLine = [];

            for (const comment of comments) {
              const body = formatComment(comment);
              const hasValidLine = (comment.start_line >= 1) || (comment.end_line >= 1);
              if (!hasValidLine) {
                commentsWithoutLine.push({ comment, body });
                continue;
              }
              const reviewComment = { path: comment.path, body };
              if (comment.start_line >= 1 && comment.end_line >= 1 && comment.start_line !== comment.end_line) {
                reviewComment.start_line = comment.start_line;
                reviewComment.line = comment.end_line;
                reviewComment.start_side = 'RIGHT';
                reviewComment.side = 'RIGHT';
              } else if (comment.end_line >= 1) {
                reviewComment.line = comment.end_line;
                reviewComment.side = 'RIGHT';
              } else if (comment.start_line >= 1) {
                reviewComment.line = comment.start_line;
                reviewComment.side = 'RIGHT';
              }
              reviewComments.push({ comment, reviewComment });
            }

            let summaryBody = buildSummaryBody(comments.length, reviewComments.length, commentsWithoutLine.length, warnings);
            summaryBody += formatSummaryComments(commentsWithoutLine);

            try {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                commit_id: commitSha,
                body: summaryBody,
                event: 'COMMENT',
                comments: reviewComments.map(({ reviewComment }) => reviewComment),
              });
            } catch (e) {
              console.log('Failed to post review with inline comments:', e.message);
              let failedCount = 0;
              const failedComments = [];
              for (const { comment, reviewComment } of reviewComments) {
                try {
                  await github.rest.pulls.createReview({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: context.issue.number,
                    commit_id: commitSha,
                    body: '',
                    event: 'COMMENT',
                    comments: [reviewComment],
                  });
                } catch (innerE) {
                  failedCount++;
                  failedComments.push({ comment, error: innerE.message });
                }
              }
              let finalBody = summaryBody;
              if (failedComments.length > 0) {
                finalBody += '\n\n---\n\n### ⚠️ Inline comments shown in summary';
                for (const { comment, error } of failedComments) {
                  finalBody += '\n\n---\n\n' + formatCommentMarkdown(comment, error);
                }
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: finalBody,
              });
            }

            function formatComment(comment) {
              let body = comment.content || '';
              if (comment.suggestion_code && comment.existing_code) {
                body += '\n\n**Suggestion:**\n```suggestion\n' + comment.suggestion_code + '\n```';
              }
              return body;
            }

            function formatCommentMarkdown(comment, error) {
              let md = `### 📄 \`${comment.path}\``;
              if (comment.start_line && comment.end_line) md += ` (L${comment.start_line}-L${comment.end_line})`;
              md += '\n\n';
              if (error) md += `⚠️ GitHub could not post this as an inline comment: ${error}\n\n`;
              md += comment.content || '';
              return md;
            }

            function buildSummaryBody(totalCount, inlineCount, summaryCount, warnings) {
              let body = `🔍 **OpenCodeReview** found **${totalCount}** issue(s) in this PR.`;
              body += `\n- ✅ ${inlineCount} posted as inline comment(s)`;
              body += `\n- 📝 ${summaryCount} posted as summary`;
              if (warnings.length > 0) body += `\n\n⚠️ ${warnings.length} warning(s) occurred during review.`;
              return body;
            }

            function formatSummaryComments(summaryComments) {
              let body = '';
              for (const { comment } of summaryComments) {
                body += '\n\n---\n\n' + formatCommentMarkdown(comment);
              }
              return body;
            }
